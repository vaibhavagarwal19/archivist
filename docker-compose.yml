# Local full-stack run: API + UI + Postgres.
# Usage: cp .env.example .env, add GROQ_API_KEY, then `docker compose up --build`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: internal_ai_agents
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/internal_ai_agents
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: .
    env_file: .env
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
  storage:
